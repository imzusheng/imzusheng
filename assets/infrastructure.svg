<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Personal AI Infrastructure</title>
  <desc id="desc">Hand-drawn system map connecting model providers, gateway, runtime, API, automation, and observability.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".013" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3"/>
    </filter>
    <style>
      .box{fill:#fffdf7;stroke:#302e29;stroke-width:1.8}
      .line{fill:none;stroke:#302e29;stroke-width:1.8;stroke-linecap:round}
      .t{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#302e29}
      .s{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#716a5f}
    </style>
  </defs>
  <rect width="960" height="300" rx="22" fill="#fbf6ea"/>
  <text class="t" x="48" y="48">Personal AI Infrastructure</text>
  <text class="s" x="48" y="70">models -> gateway / runtime -> contracts / automation -> observe</text>
  <g filter="url(#rough)" transform="translate(58 90)">
    <rect class="box" x="0" y="54" width="132" height="72" rx="9"/>
    <rect class="box" x="218" y="0" width="145" height="66" rx="9"/>
    <rect class="box" x="218" y="120" width="145" height="66" rx="9"/>
    <rect class="box" x="468" y="0" width="145" height="66" rx="9"/>
    <rect class="box" x="468" y="120" width="145" height="66" rx="9"/>
    <rect class="box" x="720" y="54" width="120" height="72" rx="9"/>
    <path id="top" class="line" d="M132 90 C169 90 172 33 218 33 H613 C663 33 677 90 720 90"/>
    <path id="bottom" class="line" d="M132 90 C169 90 172 153 218 153 H613 C663 153 677 90 720 90"/>
    <circle cx="67" cy="90" r="7" fill="#c97932"><animate attributeName="r" values="6.3;7.4;6.3" dur="5.7s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="90" r="7" fill="#6683a1"><animate attributeName="r" values="6.3;7.4;6.3" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="90" r="4" fill="#c97932"><animateMotion dur="7.8s" repeatCount="indefinite" path="M0 0 C37 0 40 -57 86 -57 H481 C531 -57 545 0 588 0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="7.8s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="90" r="3.6" fill="#78906d"><animateMotion begin="2.3s" dur="8.8s" repeatCount="indefinite" path="M0 0 C37 0 40 63 86 63 H481 C531 63 545 0 588 0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" begin="2.3s" dur="8.8s" repeatCount="indefinite"/></circle>
    <text class="s" x="31" y="82">models</text><text class="s" x="29" y="102">providers</text>
    <text class="s" x="257" y="29">Gateway</text><text class="s" x="255" y="48">routing</text>
    <text class="s" x="256" y="148">Runtime</text><text class="s" x="253" y="167">agents</text>
    <text class="s" x="517" y="29">API</text><text class="s" x="506" y="48">contracts</text>
    <text class="s" x="500" y="148">Automation</text><text class="s" x="517" y="167">jobs</text>
    <text class="s" x="746" y="82">operate</text><text class="s" x="744" y="102">observe</text>
  </g>
</svg>