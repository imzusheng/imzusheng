<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Zusheng — enter my world</title>
  <desc id="desc">A minimal black profile hero with a quiet glass portal.</desc>
  <defs>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9e2ef" stop-opacity=".11"/>
      <stop offset=".42" stop-color="#8ca2bd" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".075"/>
      <stop offset=".45" stop-color="#8d9cac" stop-opacity=".025"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".58"/>
      <stop offset=".28" stop-color="#e8eef5" stop-opacity=".12"/>
      <stop offset=".68" stop-color="#7f91a6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tinyGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <clipPath id="portalClip">
      <path d="M844 104 C902 82 1040 78 1113 105 C1162 123 1174 177 1134 207 C1076 251 920 242 850 216 C802 198 795 128 844 104 Z"/>
    </clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    </style>
  </defs>

  <rect width="1280" height="320" rx="28" fill="#050505"/>

  <!-- almost-black depth; intentionally invisible at first glance -->
  <ellipse cx="986" cy="160" rx="302" ry="188" fill="url(#ambient)" opacity=".72">
    <animate attributeName="opacity" values=".58;.78;.58" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#dbe4ef">
    <circle cx="737" cy="82" r=".7" opacity=".16"/>
    <circle cx="784" cy="230" r=".65" opacity=".11"/>
    <circle cx="1182" cy="76" r=".6" opacity=".13"/>
    <circle cx="1218" cy="197" r=".8" opacity=".1"/>
    <circle cx="684" cy="176" r=".5" opacity=".1"/>
  </g>

  <!-- identity -->
  <g transform="translate(88 96)">
    <text class="sans" x="0" y="34" fill="#f3f3f3" font-size="43" font-weight="520" letter-spacing="1.4">zusheng</text>
    <text class="mono" x="2" y="75" fill="#8c8c8c" font-size="14" letter-spacing=".15">frontend engineer / agent-native builder</text>
    <text class="sans" x="2" y="113" fill="#555" font-size="14.5" letter-spacing=".05">building things for humans, agents, and the space between.</text>
  </g>

  <!-- faint gravity field -->
  <g fill="none" stroke="#aab7c6" stroke-width="1">
    <path d="M744 198 C812 253 1047 274 1180 195" opacity=".045" stroke-dasharray="1 8">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M758 120 C842 59 1076 48 1174 117" opacity=".035"/>
  </g>

  <!-- portal -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.7;0 0" dur="9s" repeatCount="indefinite"/>

    <path d="M844 104 C902 82 1040 78 1113 105 C1162 123 1174 177 1134 207 C1076 251 920 242 850 216 C802 198 795 128 844 104 Z"
          fill="#cbd7e6" opacity=".045" filter="url(#softGlow)"/>

    <path d="M844 104 C902 82 1040 78 1113 105 C1162 123 1174 177 1134 207 C1076 251 920 242 850 216 C802 198 795 128 844 104 Z"
          fill="url(#glass)" stroke="url(#rim)" stroke-width="1.15"/>

    <path d="M856 112 C925 88 1046 87 1102 108 C1122 115 1138 126 1148 140"
          fill="none" stroke="url(#sheen)" stroke-width="1.35" stroke-linecap="round" opacity=".42">
      <animate attributeName="opacity" values=".18;.58;.18" keyTimes="0;.48;1" dur="8.5s" repeatCount="indefinite"/>
    </path>

    <g clip-path="url(#portalClip)" opacity=".25">
      <rect x="782" y="66" width="82" height="220" fill="url(#sheen)" transform="rotate(15 823 176)">
        <animate attributeName="x" values="770;1180" dur="8.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text class="sans" x="946" y="165" text-anchor="middle" dominant-baseline="middle" fill="#e8e8e8" font-size="16" font-weight="480" letter-spacing="1.6">enter</text>
    <text class="sans" x="1002" y="165" dominant-baseline="middle" fill="#8f969e" font-size="17" font-weight="400">↗</text>
  </g>

  <!-- one living point, not a star field -->
  <g>
    <circle cx="806" cy="190" r="8" fill="#c7d3df" opacity=".035" filter="url(#tinyGlow)"/>
    <circle cx="806" cy="190" r="1.2" fill="#e9f0f7" opacity=".58">
      <animate attributeName="opacity" values=".18;.68;.18" dur="6.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>