<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Zusheng — Frontend Engineer × Agent-assisted Builder</title>
  <desc id="desc">Warm hand-drawn profile banner with an exploration path from idea to build to verify.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <style>
      .ink{stroke:#2f2d28;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .muted{fill:#716a5f}
      .mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
      .title{font:500 58px Georgia,serif;fill:#24231f;letter-spacing:-2px}
      .sub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#383631}
    </style>
  </defs>
  <rect width="960" height="260" rx="24" fill="#fbf6ea"/>
  <g opacity=".18">
    <path d="M0 52H960M0 104H960M0 156H960M0 208H960" stroke="#cfc3ad" stroke-width="1"/>
    <path d="M96 0V260M192 0V260M288 0V260M384 0V260M480 0V260M576 0V260M672 0V260M768 0V260M864 0V260" stroke="#cfc3ad" stroke-width="1"/>
  </g>
  <g transform="translate(52 52)">
    <text class="title" x="0" y="56">Zusheng</text>
    <text class="sub" x="2" y="92">Frontend Engineer × Agent-assisted Builder</text>
    <text class="mono muted" x="2" y="126">React · TypeScript · Electron · AI Agent</text>
  </g>
  <g filter="url(#rough)" transform="translate(560 22)">
    <ellipse class="ink" cx="190" cy="105" rx="76" ry="52" opacity=".82"/>
    <ellipse class="ink" cx="190" cy="105" rx="128" ry="30" transform="rotate(-13 190 105)" opacity=".72"/>
    <path id="route" class="ink" d="M38 174 C82 140 113 166 140 132 S184 85 219 96 S280 130 342 54" opacity=".48"/>
    <path d="M38 174 C82 140 113 166 140 132 S184 85 219 96 S280 130 342 54" stroke="#c97932" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="3 10" opacity=".86">
      <animate attributeName="stroke-dashoffset" values="0;-130" dur="18s" repeatCount="indefinite"/>
    </path>
    <circle cx="190" cy="105" r="9" fill="#c97932">
      <animate attributeName="r" values="8.4;9.7;8.4" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".82;1;.82" dur="5.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="174" r="4" fill="#6683a1">
      <animateMotion dur="11s" repeatCount="indefinite" path="M0 0 C44 -34 75 -8 102 -42 S146 -89 181 -78 S242 -44 304 -120"/>
      <animate attributeName="opacity" values=".08;1;1;.08" keyTimes="0;.08;.9;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <path class="ink" d="M48 36h28M62 22v28" opacity=".7"/>
    <path class="ink" d="M308 148q24 8 36-9M330 135l13 3-7 11" opacity=".7"/>
    <text class="mono muted" x="20" y="196">idea</text>
    <text class="mono muted" x="124" y="150">build</text>
    <text class="mono muted" x="215" y="116">verify</text>
    <text class="mono muted" x="313" y="43">next?</text>
  </g>
</svg>