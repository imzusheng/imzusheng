<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Exploration Radius</title>
  <desc id="desc">Abstract hand-drawn journey from CAD to ESP32 to 3D printing to a verified prototype.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.35"/>
    </filter>
    <style>
      .ink{fill:none;stroke:#302e29;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .m{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#716a5f}
      .t{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#302e29}
    </style>
  </defs>
  <rect width="960" height="300" rx="22" fill="#fbf6ea"/>
  <text class="t" x="48" y="50">Exploration Radius</text>
  <text class="m" x="48" y="72">measure -> design -> build -> verify -> iterate</text>
  <g filter="url(#rough)" transform="translate(128 88)">
    <g>
      <path class="ink" d="M0 28 l58 -31 56 31 -57 32z M0 28v64l57 32 57-32V28 M57 60v64"/>
      <path d="M8 6h30M8 1v10M38 1v10" stroke="#c97932" stroke-width="2" fill="none"><animate attributeName="opacity" values=".25;1;.25" dur="6.4s" repeatCount="indefinite"/></path>
      <text class="m" x="34" y="145">CAD</text>
    </g>
    <g transform="translate(223 0)">
      <rect class="ink" x="0" y="2" width="90" height="98"/>
      <rect class="ink" x="12" y="16" width="66" height="56"/>
      <path class="ink" d="M24 88h42"/>
      <circle cx="45" cy="44" r="6" fill="#6683a1"><animate attributeName="r" values="5.4;6.6;5.4" dur="5.9s" repeatCount="indefinite"/></circle>
      <text class="m" x="26" y="126">ESP32</text>
    </g>
    <g transform="translate(455 1)">
      <path class="ink" d="M0 10 q40 -22 80 0 v82 q-40 20 -80 0z"/>
      <path d="M18 35h43" stroke="#302e29" stroke-width="1.8" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 43;43 0;0 43" dur="7s" repeatCount="indefinite"/></path>
      <path d="M18 52h32" stroke="#302e29" stroke-width="1.8" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 32;32 0;0 32" begin="1.1s" dur="7s" repeatCount="indefinite"/></path>
      <path d="M18 69h37" stroke="#302e29" stroke-width="1.8" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 37;37 0;0 37" begin="2.2s" dur="7s" repeatCount="indefinite"/></path>
      <text class="m" x="18" y="126">PRINT</text>
    </g>
    <g transform="translate(648 74)">
      <rect class="ink" x="0" y="0" width="120" height="54" rx="9"/>
      <rect class="ink" x="13" y="16" width="27" height="20"/>
      <path class="ink" d="M59 16q12-12 24 0v19H59zM97 14l18 21m0-21-18 21"/>
      <circle cx="75" cy="26" r="5" fill="#c97932"><animate attributeName="opacity" values=".5;1;.5" dur="4.8s" repeatCount="indefinite"/></circle>
      <text class="m" x="27" y="77">prototype</text>
    </g>
    <path id="journey" class="ink" d="M114 122 C151 147 188 141 223 102 C270 145 393 145 455 103 C527 151 618 155 648 108" opacity=".5"/>
    <circle cx="114" cy="122" r="4" fill="#78906d"><animateMotion dur="10.8s" repeatCount="indefinite" path="M0 0 C37 25 74 19 109 -20 C156 23 279 23 341 -19 C413 29 504 33 534 -14"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.07;.91;1" dur="10.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>