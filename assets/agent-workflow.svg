<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workflow</title>
  <desc id="desc">Goal, research, build, review, test and verify, with a feedback loop when evidence says no.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/>
    </filter>
    <style>
      .c{fill:#fffdf7;stroke:#302e29;stroke-width:1.8}
      .l{fill:none;stroke:#302e29;stroke-width:1.8;stroke-linecap:round}
      .m{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#302e29;text-anchor:middle}
      .small{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#756e62;text-anchor:middle}
    </style>
  </defs>
  <rect width="960" height="250" rx="22" fill="#fffaf0"/>
  <g filter="url(#rough)" transform="translate(60 54)">
    <path class="l" d="M82 55H740"/>
    <path d="M764 83 C704 139 190 151 99 95" fill="none" stroke="#c97932" stroke-width="2" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" values="0;210" dur="9.6s" repeatCount="indefinite"/></path>
    <g>
      <circle class="c" cx="70" cy="55" r="38"><animate attributeName="r" values="38;40;38" begin="0s" dur="9.6s" repeatCount="indefinite" keyTimes="0;.08;.2;1"/></circle>
      <circle class="c" cx="210" cy="55" r="38"><animate attributeName="r" values="38;40;38" begin="1.6s" dur="9.6s" repeatCount="indefinite" keyTimes="0;.08;.2;1"/></circle>
      <circle class="c" cx="350" cy="55" r="38"><animate attributeName="r" values="38;40;38" begin="3.2s" dur="9.6s" repeatCount="indefinite" keyTimes="0;.08;.2;1"/></circle>
      <circle class="c" cx="490" cy="55" r="38"><animate attributeName="r" values="38;40;38" begin="4.8s" dur="9.6s" repeatCount="indefinite" keyTimes="0;.08;.2;1"/></circle>
      <circle class="c" cx="630" cy="55" r="38"><animate attributeName="r" values="38;40;38" begin="6.4s" dur="9.6s" repeatCount="indefinite" keyTimes="0;.08;.2;1"/></circle>
      <circle class="c" cx="770" cy="55" r="32"><animate attributeName="r" values="32;34;32" begin="8s" dur="9.6s" repeatCount="indefinite" keyTimes="0;.08;.2;1"/></circle>
    </g>
    <circle cx="70" cy="55" r="4.4" fill="#6683a1"><animateMotion dur="9.6s" repeatCount="indefinite" path="M0 0 H700"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.88;.94" dur="9.6s" repeatCount="indefinite"/></circle>
    <circle cx="764" cy="83" r="3.6" fill="#c97932"><animateMotion begin="8s" dur="9.6s" repeatCount="indefinite" path="M0 0 C-60 56 -574 68 -665 12"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.78;.82;.96;1" begin="8s" dur="9.6s" repeatCount="indefinite"/></circle>
    <text class="m" x="70" y="53">GOAL</text><text class="small" x="70" y="69">boundary</text>
    <text class="m" x="210" y="53">RESEARCH</text><text class="small" x="210" y="69">agent</text>
    <text class="m" x="350" y="53">BUILD</text><text class="small" x="350" y="69">implement</text>
    <text class="m" x="490" y="53">REVIEW</text><text class="small" x="490" y="69">diff</text>
    <text class="m" x="630" y="53">TEST</text><text class="small" x="630" y="69">build / log</text>
    <text class="m" x="770" y="53">VERIFY</text><text class="small" x="770" y="69">runtime</text>
    <text class="small" x="428" y="154">evidence says no? -> loop back</text>
  </g>
</svg>